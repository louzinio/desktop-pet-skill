name: tests

on:
  push:
  pull_request:

jobs:
  core-and-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pytest
      - name: Python core and the reference trace
        run: pytest -q tests/test_core.py
      - name: JavaScript core against the same trace
        run: node --test tests/js/trace.test.mjs

  qt-and-web:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt's system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install pytest PySide6 PyQt6 PyQt5 playwright
      - run: python -m playwright install --with-deps chromium
      - name: Qt adapter on PySide6
        run: DESKTOP_PET_QT=PySide6 pytest -q tests/test_qt.py
      - name: Qt adapter on PyQt6
        run: DESKTOP_PET_QT=PyQt6 pytest -q tests/test_qt.py
      - name: Qt adapter on PyQt5
        run: DESKTOP_PET_QT=PyQt5 pytest -q tests/test_qt.py
      - name: Web adapter in Chromium
        run: pytest -q tests/test_web.py

  tk-and-gtk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System Python with Tk, GTK 3, an X server and real clicks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk python3-gi python3-gi-cairo gir1.2-gtk-3.0 python3-pytest xvfb xdotool
      - name: Tk and GTK adapters on X11
        run: xvfb-run -a /usr/bin/python3 -m pytest -q tests/test_tk.py tests/test_gtk.py
